# Local development only. Hosted configuration is reviewed separately.
project_id = "pals-local"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed/local.sql"]

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/auth/callback"]
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

# Disposable local integration tests send only to the local mail catcher.
[auth.rate_limit]
email_sent = 100

[local_smtp]
enabled = true
port = 54324

[studio]
enabled = false

[realtime]
enabled = false

[storage]
enabled = true

[edge_runtime]
enabled = false

[analytics]
enabled = false
