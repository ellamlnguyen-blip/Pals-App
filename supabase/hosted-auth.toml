# Reviewed hosted Auth settings only. Do not push local config.toml to a hosted project.
# Apply via an isolated Supabase workdir after reviewing `supabase config diff`.
project_id = "pals-hosted-auth"

[auth]
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12
additional_redirect_urls = ["http://127.0.0.1:3000/auth/callback", "http://localhost:3000/auth/callback"]

[auth.email]
enable_confirmations = true
double_confirm_changes = true
