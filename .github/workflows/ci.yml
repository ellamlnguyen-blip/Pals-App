name: CI
on:
  pull_request:
  push:
    branches: [main, "agent/**"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: local
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: local
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker network create -o com.docker.network.bridge.host_binding_ipv4=127.0.0.1 pals-local-network
      - run: pnpm db:start
      - run: pnpm db:verify
      - if: always()
        run: pnpm db:stop
